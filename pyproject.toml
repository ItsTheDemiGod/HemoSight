[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hemosight"
version = "0.0.0"
description = "Non-invasive anemia screening by spectral unmixing of ordinary photographs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    # --- CUDA build, pinned deliberately -------------------------------------
    # Installed from the PyTorch CUDA index, NOT from PyPI:
    #     pip install torch torchvision \
    #         --index-url https://download.pytorch.org/whl/cu126
    #
    # CPU WHEELS MUST NOT BE INSTALLED BY DEFAULT. The default PyPI index serves a
    # CPU-only wheel on Windows; installing it silently disables the RTX 4060 and
    # makes Phases 3, 5 and 8 unusably slow. The `+cu126` local version below is
    # not published on PyPI, so a plain `pip install -e .` fails loudly with a
    # resolution error instead of quietly degrading to CPU. That is intentional:
    # supply the --index-url above and it resolves.
    #
    # See CLAUDE.md, TECH STACK, and the DECISION LOG correction dated 2026-09-11.
    "torch==2.14.0+cu126",
    "torchvision==0.29.0+cu126",
    # -------------------------------------------------------------------------
    "opencv-python>=4.9",
    "rawpy>=0.19",
    "imageio>=2.34",
    "matplotlib>=3.8",
    "colour-science>=0.4.4",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",        # PDF export of audit reports (Phase 6.5: was a 501 without it)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Report generators emit markdown tables and prose; wrapping those source lines
# would make the generated output harder to read than the source.
"scripts/data_audit_report_phase1.py" = ["E501"]
"scripts/data_summary_report_phase1.py" = ["E501"]
"scripts/remediation_report_phase1_5.py" = ["E501"]
